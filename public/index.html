<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#009293">
  <title>PrevQuedasRV</title>
  <link rel="icon" href="assets/ui/logo.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/aframe.min.js"></script>
  <script src="data/scenes.js"></script>
  <script src="js/stereo.js"></script>
  <script src="js/components.js"></script>
  <script src="js/engine.js"></script>
</head>
<body>
  <!-- Tela de entrada (gesto do usuario libera audio, tela cheia e giroscopio) -->
  <div id="intro" class="overlay">
    <div class="intro-card">
      <img src="assets/ui/logo.png" alt="" class="logo">
      <h1>Prev'quedasRV</h1>
      <p>Realidade virtual para prevenção de quedas em casa</p>
      <button id="btn-cardboard" class="primary">Usar com óculos (Cardboard)</button>
      <button id="btn-magic" class="secondary">Ver sem óculos</button>
      <p class="hint">Olhe para um objeto por 2 segundos, ou toque na tela, para selecionar.</p>
    </div>
  </div>

  <div id="loading" class="loading" hidden>Carregando…</div>
  <button id="btn-toggle-stereo" class="corner" hidden aria-label="Alternar modo óculos">👓</button>
  <div id="cardboard-divider" hidden></div>

  <a-scene
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; antialias: true; maxCanvasWidth: 2560; maxCanvasHeight: 1440"
    loading-screen="enabled: false"
    background="color: #9fb6bf"
    stereo-mode
    >
    <a-entity id="world"></a-entity>

    <!-- Rig da camera: rig (posicao/rotacao da cena) > recentro (gira para a direcao inicial) > camera -->
    <a-entity id="rig">
      <a-entity id="recenter" look-down-menu>
        <a-entity id="camera" camera="fov: 80; near: 0.05; far: 100" look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true; touchEnabled: false" wasd-controls="enabled: false">
          <a-entity id="cursor"
            cursor="fuse: true; fuseTimeout: 1800; rayOrigin: entity"
            raycaster="objects: .clickable; far: 30; interval: 60; origin: 0 0 1.2"
            position="0 0 -1.2"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #ffffff; shader: flat; opacity: 0.9; transparent: true; depthTest: false"
            fuse-ring>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script src="js/app.js"></script>
</body>
</html>
